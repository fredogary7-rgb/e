{% endraw %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Service indisponible — NectarPro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:60px 40px;max-width:500px;width:100%}
.icon{font-size:64px;color:#ef4444;margin-bottom:20px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
h1{font-size:24px;font-weight:900;margin-bottom:8px}
h1 span{color:#ef4444}
p{font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:24px}
.btn-back{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:50px;text-decoration:none;font-weight:600;font-size:14px;transition:all .3s}
.btn-back:hover{background:rgba(239,68,68,.25);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="card">
<div class="icon"><i class="fa fa-shield-halved"></i></div>
<h1>Service <span>indisponible</span></h1>
<p>Pour des raisons de securite et de conformite, ce service est temporairement suspendu. Notre equipe travaille a sa remise en conformite. Veuillez nous excuser pour la gene occasionnee.</p>
<a href="/dashboard" class="btn-back"><i class="fa fa-arrow-left"></i> Retour au dashboard</a>
</div>
</body>
</html>
{% endraw %}
